name: MLflow Project Retraining

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: khoirulhuda1703/workflow-ci
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/MLProject/mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run MLflow Project
        run: mlflow run MLProject --env-manager=local

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: MLProject/mlruns/

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required for advanced Docker Hub push."
            exit 1
          fi

      - name: Resolve latest MLflow run id
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import yaml

          candidates = []
          for meta_path in Path("MLProject/mlruns").glob("*/*/meta.yaml"):
              run_dir = meta_path.parent
              if run_dir.name.startswith("."):
                  continue
              meta = yaml.safe_load(meta_path.read_text())
              candidates.append((meta.get("start_time", 0), run_dir.name))

          if not candidates:
              raise SystemExit("No MLflow run id found.")

          latest_run_id = sorted(candidates)[-1][1]
          print(f"RUN_ID={latest_run_id}")
          PY

      - name: Build Docker image from MLflow model
        run: |
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "$DOCKERHUB_REPOSITORY:latest"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push "$DOCKERHUB_REPOSITORY:latest"
